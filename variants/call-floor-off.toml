why = """
OFF -- the one change in this arm, and it is the control's whole job. The
frozen value "basis" forbids any covered call whose strike sits below net
basis; under the current config that floor is the proximate cause of 585 of
the 641 uncovered slot-days (496 call_gated_no_credit + 89
covered_call_unreachable). Unsetting it removes the floor entirely so the
write always happens at the call_delta=0.50 target, which sits approximately
at spot -- never below current market, so this cannot repeat tier 2's
below-market cap (the poison that rejected exit-ladder-on). The cost being
measured: a call written at spot while the position is underwater can lock in
a realized loss on the shares when it is called away. That cost, priced
honestly at both widths, is the bracket every gentler floor arm is read
against.
"""
