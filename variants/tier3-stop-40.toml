note = """
GATE-CAMPAIGN BATCH 1, WAVE 1 (Analyzer bar v2, 2026-08-17). Rung 0.30 of a
MANDATORY three-rung ladder (tier3-stop-40 / -40 / -50) -- never read one rung
alone; the -40% stop of 2026-07 looked excellent alone and did not survive its
neighbours.

THE ARM. assignment_exit on, exit_trigger = "never" (tier 2 fully disabled --
the basis floor keeps its patience, no below-basis call is ever written by
this mechanic), exit_stop = "pct_below_basis" with the stop percentage carried
by exit_stop_buffer (confirmed: tier3_stop_hit reads exit_stop_buffer for this
mode; exit_trigger_pct belongs to tier 2's trigger and is NOT set here;
engine-tested in tests/engine_v2/options/test_assignment_exit.py, the
trigger-never cases). This is the arm exit-ladder-on's verdict named as "the
shape the data asks for" and recorded as not-run, with the inert-arm trap
(exit_trigger never + default exit_stop = silently dead) avoided exactly as
that verdict prescribed.

MECHANISM. The uncovered mass is concentrated in never-resolvers: 4 of 40
assignments never resolved and ate 51% of every held-day (2026-08-14
stuck-campaign review); NIO is stuck in the live book now. A freed slot
re-enters a pool 3x deeper than when stops were last priced (menu depth 3.5 ->
11.7, starved sessions 23.5% -> 5.0% after the 10/4 floors), so the
opportunity side of a stop is larger than in any previous measurement.

REGISTERED PREDICTION (in the file before the run, so the result grades the
prediction too): prior evidence leans FAIL on P&L via 2026 realized losses --
holding beat dumping in the earlier accounting, and the oracle prize was
modest. Either way this run CLOSES the owner's standing "liquidate when no
call can be found" proposal with a measured answer.

THE BAR, DECLARED BEFORE THE RUN (Analyzer, final version).

  MECHANISM-ALIVE: shares_sold >= 1, else the card is NOT-EVIDENCE (an armed
  stop that never fired measures nothing -- and nothing in the engine flags
  that state; the card looks valid).

  REJECT REGARDLESS OF P&L: sold_per_assignment > 1/3 at ANY rung -- a stop
  that common is the -40% stop in a ladder's clothes.

  PASS AT THE SHIPPING RUNG requires ALL of:
    * days_uncovered <= 450
    * pnl_per_slotday_assigned >= 11.77 dollars (the base figure)
    * campaigns >= 142
    * at n5 AND n20: total_return >= base - 10pp AND ret_per_maxdd >= base - 0.35
    * year-bucket rule: worse than base in at most 1 of 3 buckets
      (2024/2025/2026) by more than 3pp

  DIAL CHECK across the ladder:
    * days_uncovered and shares_sold must drift MONOTONICALLY with stop depth
    * middle-rung ret/DD must not exceed BOTH neighbours by more than 0.5 --
      the -40% spike detector.

SHARED BATCH RULES. Noise band: at n5, total_return within base - 10pp is
"not degraded".
