[ops]
# The shared [ops] is n_slots = 1, at which an exit mechanic has almost
# nothing to fire on. Five is the width every capacity claim is stated at.
n_slots = 5

[knobs.assignment_exit]
value = true
why = """
ON -- gives the assigned position a second exit besides being called away.
Never naked: tier 3 sells shares only if the short call is closed in the same
step, else the sale is refused (engine invariant, tested). With exit_trigger
= "never" below, switching this on arms ONLY the deep stop: tier 2, the rung
that rejected exit-ladder-on by writing fat below-basis calls, stays
structurally off.
"""
source = "exit-ladder-on verdict 2026-08-17 (named not-run arm); Analyzer batch-1 v2"

[knobs.exit_trigger]
value = "never"
why = """
Tier 2 disabled entirely. exit-ladder-on measured tier 2 as the ladder's
poison: below-basis 0.80-delta calls sold the recovery away for a one-off
credit (call credit 19,179 -> 53,206 dollars, ret/DD 1.03 -> -0.46). "never"
keeps the basis floor's patience exactly as frozen has it and leaves tier 3 as
a pure tail stop -- the shape the 2026-08-14 stuck-campaign review argues for,
since 4 of 40 assignments carried 51% of all held-days.
"""
source = "exit-ladder-on scorecard live (rejected 2026-08-17)"

[knobs.exit_stop]
value = "pct_below_basis"
why = """
The one exit_stop mode that works without tier 2: the ladder modes read the
tier-2 exit_strike, which "never" leaves as None, and tier3_stop_hit returns
False on a None strike -- the documented inert-arm trap. pct_below_basis fires
off net basis directly (spot < net_basis * (1 - exit_stop_buffer)), needs no
tier-2 write, and is the plain-stop control the engine kept for exactly this
benchmark. Aliveness is engine-tested (test_assignment_exit.py: pct_below_basis
fires without any exit_strike; trigger-never still lets the deep stop fire).
"""
source = "portfolio.tier3_stop_hit; tests/engine_v2/options/test_assignment_exit.py"

[knobs.exit_stop_buffer]
value = 0.40
why = """
The stop depth for exit_stop="pct_below_basis": sell once spot is 40% below
net basis; the middle rung of the 0.30/0.40/0.50 ladder, run with both
neighbours so a single-rung spike is readable.
"""
source = "Analyzer batch-1 v2 ladder spec (2026-08-17)"

[knobs.exit_cooldown_days]
value = 0
why = """
No re-entry ban after a stop, explicitly zero (the engine default, written
down so the ladder is one moving part). A cooldown is a second threshold on
the same 45-event sample; the ladder varies stop depth only.
"""
source = "Analyzer batch-1 v2 ladder spec (2026-08-17)"
