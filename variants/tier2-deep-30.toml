name = "tier2-deep-30"
question = "Does tier 2 work once it is gated DEEP -- the 0.80-delta rescue call allowed only after spot has fallen 30% below net basis -- instead of firing on the routine case that rejected exit-ladder-on?"
base = "frozen"
