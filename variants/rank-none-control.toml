Closed-set value on the existing knob, refused elsewhere. Built and tested
2026-08-18 (BUILD A batch 4, test_rank_none.py, 5 cases).
"""
source = "Batch-4 pre-registration (batch-3 close, 2026-08-18); owner gate opened 2026-08-18"
